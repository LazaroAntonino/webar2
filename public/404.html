<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c2e51" />
    <meta name="robots" content="noindex, follow" />
    <title>Página no encontrada | AR2 Consulting Inmobiliario</title>
    <meta
      name="description"
      content="La página que buscas no existe o ha sido movida. Vuelve al inicio o explora los inmuebles disponibles en AR2 Consulting Inmobiliario."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --navy: #1c2e51;
        --navy-dark: #15243f;
        --navy-deep: #0f1a2e;
        --navy-light: #2a3f6b;
        --gold: #fab422;
        --gold-light: #fcc44a;
        --soft: #e6e8ec;
        --muted: #9aa3b2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at 82% 12%, rgba(42, 63, 107, 0.65), transparent 55%),
          linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-light) 100%);
        color: #fff;
        font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .card {
        width: 100%;
        max-width: 640px;
        text-align: center;
        padding: clamp(32px, 6vw, 64px) clamp(24px, 5vw, 56px);
        background: rgba(15, 26, 46, 0.55);
        border: 1px solid rgba(250, 180, 34, 0.28);
        border-radius: 20px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      }

      .brand {
        display: inline-block;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .code {
        margin: 8px 0 0;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: clamp(88px, 22vw, 148px);
        font-weight: 700;
        line-height: 1;
        color: rgba(250, 180, 34, 0.14);
        -webkit-text-stroke: 2px var(--gold);
        user-select: none;
      }

      h1 {
        margin: 8px 0 16px;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: clamp(26px, 5vw, 38px);
        font-weight: 600;
        line-height: 1.2;
      }

      p {
        margin: 0 auto 32px;
        max-width: 44ch;
        font-size: clamp(15px, 2.2vw, 17px);
        line-height: 1.65;
        color: var(--soft);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
      }

      .btn {
        display: inline-block;
        padding: 15px 28px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .btn--primary {
        background: var(--gold);
        color: var(--navy-deep);
        box-shadow: 0 10px 26px rgba(250, 180, 34, 0.3);
      }

      .btn--primary:hover {
        background: var(--gold-light);
        transform: translateY(-2px);
      }

      .btn--ghost {
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
      }

      .btn--ghost:hover {
        border-color: var(--gold);
        color: var(--gold);
        transform: translateY(-2px);
      }

      .btn:focus-visible {
        outline: 2px solid var(--gold-light);
        outline-offset: 3px;
      }

      .contact {
        margin: 36px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .contact a {
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px solid rgba(154, 163, 178, 0.4);
      }

      .contact a:hover {
        color: var(--gold);
        border-color: var(--gold);
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="brand">AR2 Consulting Inmobiliario</span>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página no encontrada</h1>
      <p>
        Lo sentimos, la página que buscas no existe o ha sido movida. Puedes volver
        al inicio o consultar los inmuebles que tenemos disponibles.
      </p>
      <div class="actions">
        <a class="btn btn--primary" href="/">Volver al inicio</a>
        <a class="btn btn--ghost" href="/inmuebles">Ver inmuebles</a>
      </div>
      <p class="contact">
        ¿Necesitas ayuda? <a href="tel:+34640081599">+34 640 08 15 99</a> ·
        <a href="mailto:info@ar2house.com">info@ar2house.com</a>
      </p>
    </main>
  </body>
</html>
